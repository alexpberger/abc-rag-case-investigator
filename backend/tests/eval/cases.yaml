- id: policy-verified-income
  query: What verified income and employment tenure does the credit policy require?
  expected_document_ids:
    - credit-policy
  expected_section_contains:
    - Verified income

- id: policy-stated-income
  query: What does the policy say stated income or irregular overtime cannot establish on its own?
  expected_document_ids:
    - credit-policy
  expected_section_contains:
    - Stated and irregular income

- id: application-employment
  query: What does the applicant say about employment, income, and existing obligations?
  expected_document_ids:
    - loan-application
  expected_section_contains:
    - Employment and income

- id: payslip-start-date
  query: What employment start date do the payslips record?
  expected_document_ids:
    - income-documentation
  expected_section_contains:
    - Employer start date

- id: policy-records-required
  query: Which records does the credit policy still require before a person decides the loan?
  expected_document_ids:
    - credit-policy
  expected_section_contains:
    - Information required

- id: correspondence-incomplete
  query: Did the applicant provide the employer letter and the year-end income document the case worker requested?
  expected_document_ids:
    - customer-correspondence
  expected_section_contains:
    - Customer reply
