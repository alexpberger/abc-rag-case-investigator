[project]
name = "abc-rag-case-investigator"
version = "0.1.0"
description = "A small RAG demo for investigating a fictional home-insurance case."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "openai>=1.58.1",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.3",
    "psycopg-pool>=3.2.4",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/schema.sql" = "app/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "eval: retrieval evaluation that calls Azure OpenAI and Postgres (opt-in)",
]
